<div class="admin-layout">
  <!-- Overlay for mobile -->
  @if (sidebarOpen()) {
    <div class="sidebar-overlay" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar with inline style for debugging -->
  <aside class="sidebar" [style.transform]="sidebarOpen() ? 'translateX(0)' : 'translateX(-100%)'">
    <div class="sidebar-header">
      <h2 class="logo">🗳️ PollAdmin</h2>
      <button
        type="button"
        class="toggle-btn close"
        (click)="closeSidebar(); $event.stopPropagation()"
        aria-label="Close sidebar"
      >
        ✕
      </button>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-link"
          (click)="closeSidebar()"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <span class="user-name">{{ authService.user()?.name }}</span>
        <span class="user-role">{{ authService.user()?.role }}</span>
      </div>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Mobile header bar -->
    <div class="mobile-header">
      <button
        type="button"
        class="toggle-btn open"
        (click)="toggleSidebar(); $event.stopPropagation()"
        aria-label="Open sidebar"
      >
        ☰
      </button>
      <span class="mobile-title">PollAdmin</span>
    </div>

    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
