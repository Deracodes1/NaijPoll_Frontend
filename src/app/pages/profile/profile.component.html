<div class="profile-container">
  <div class="profile-card">
    <div class="profile-header">
      <div class="avatar">{{ getInitials(profile()!.name) }}</div>
      <h2 class="profile-name">{{ profile()!.name }}</h2>
      <div class="verified-badge">
        <span>✓</span>
        <span>VERIFIED CITIZEN</span>
      </div>
      <p class="voter-id">{{ profile()!.id | voterId: profile()!.joinedDate }}</p>
    </div>

    <app-button type="button" [disabled]="true"> ✎ Edit Profile </app-button>

    <div class="info-section">
      <div class="section-header">
        <span class="section-icon">✉️</span>
        <span class="section-title">Contact Information</span>
      </div>
      <div class="info-row">
        <span class="info-label">Email Address</span>
        <span class="info-value">{{ profile()!.email }}</span>
      </div>
    </div>

    <div class="info-section">
      <div class="section-header">
        <span class="section-icon"></span>
        <span class="section-title">Registration Location</span>
      </div>
      <div class="info-row">
        <span class="info-label">State of Residence</span>
        <span class="info-value">{{ profile()!.state }} State</span>
      </div>
    </div>

    <button class="logout-btn" (click)="logout()">🚪 Logout</button>
  </div>
</div>
