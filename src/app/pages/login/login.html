<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#059669"
          stroke-width="2"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <line x1="9" y1="9" x2="15" y2="9" />
          <line x1="9" y1="13" x2="15" y2="13" />
          <line x1="9" y1="17" x2="11" y2="17" />
        </svg>
        <span class="logo-text">NaijPoll</span>
      </div>
      <h1 class="title">Sign In</h1>
      <p class="subtitle">Enter your credentials to access the ballot box.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <app-input
        id="email"
        label="Email Address"
        type="email"
        placeholder="ezemeniachidera@gmail.com"
        icon="✉️"
        [control]="emailControl"
        errorMessage="Please enter a valid email address"
      />

      <div class="password-wrapper">
        <app-input
          id="password"
          label="Password"
          type="password"
          placeholder="Enter your password"
          icon="🔒"
          [control]="passwordControl"
          errorMessage="Password is required"
        />
      </div>

      <div class="forgot-password">
        <a routerLink="/forgot-password">Forgot password?</a>
      </div>

      @if (authService.error()) {
        <app-alert [message]="authService.error()!" type="error" />
      }

      <app-button type="submit" [disabled]="!canSubmit()" [loading]="authService.isLoading()">
        Sign In →
      </app-button>
    </form>

    <p class="login-footer">
      Don't have an account?
      <a (click)="goToSign()" routerLink="signup" class="signup-link">Sign up</a>
    </p>

    <div class="verified-badge">
      <span>🛡️</span>
      <span>Our Official Verification Portal</span>
    </div>
  </div>
</div>
